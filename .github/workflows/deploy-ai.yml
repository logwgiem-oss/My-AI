name: Compile and Deploy iPhone AI Engine

on:
  push:
    branches:
      - main  # Triggers the action every time you push or change code

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Fetch and Package Pre-compiled Production Binaries
        run: |
          mkdir -p engine
          # Reaches out to the compiled distribution registry to pull down the complete runtime bundle
          npm pack @wllama/wllama@3.5.1
          tar -xzf wllama-3.5.1.tgz
          
          # Extracts every background script, worker thread, and .wasm compiler binary file needed
          cp package/dist/index.iife.js ./engine/wllama.js
          cp package/dist/wllama.wasm ./engine/wllama.wasmb
          cp package/dist/wllama.worker.mjs ./engine/wllama.worker.mjs
          
          # Renames the file ext for absolute raw binary MIME type serving compatibility over GitHub Pages
          mv ./engine/wllama.wasmb ./engine/wllama.wasm

      - name: Deploy Complete Node straight to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # Deploys your root files along with the newly injected engine directory
          branch: gh-pages # Pushes everything to the dedicated active page channel
