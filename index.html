<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen 2.5 Coder AI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: auto; }
        #chat { height: 350px; border: 1px solid #333; padding: 15px; overflow-y: auto; background: #1a1a1a; margin-bottom: 10px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
        #status { color: #aaa; font-style: italic; margin-bottom: 15px; font-size: 13px; text-align: center; background: #222; padding: 8px; border-radius: 5px; }
        .input-container { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; font-size: 14px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
        .msg { margin-bottom: 10px; }
        .user-msg { color: #64b5f6; }
        .ai-msg { color: #a5d6a7; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-bottom: 5px;">Qwen 2.5 Coder AI</h2>
    <div id="status">Loading Local Engine...</div>
    <div id="chat"></div>
    
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Type a message...">
        <!-- Button starts as disabled so you can't click it early and crash the code -->
        <button id="sendBtn" disabled>Send</button>
    </div>

    <script type="module">
        import { Wllama } from "./wllama.js";

        const MODEL_URL = "https://huggingface.co/LowgieM/Ai/resolve/main/qwen2.5-coder-1.5b-instruct-q2_k.gguf";

        let wllama;
        let isEngineReady = false; // Safety lock flag
        
        const statusDiv = document.getElementById('status');
        const chatDiv = document.getElementById('chat');
        const sendBtn = document.getElementById('sendBtn');
        const inputField = document.getElementById('userInput');

        async function initAI() {
            try {
                statusDiv.innerText = "Compiling Local WebAssembly Engine Binary...";
                
                wllama = new Wllama({
                    "default": "./wllama.wasm"
                });

                statusDiv.innerText = "Streaming model into browser cache (please wait)...";
                
                // Using the exact version 3 URL loader syntax from Wllama spec
                await wllama.loadModelFromUrl(MODEL_URL);

                statusDiv.innerText = "✨ AI Ready! Running 100% locally in your browser tab.";
                
                // Unlock the safety flags
                isEngineReady = true;
                sendBtn.disabled = false;
            } catch (err) {
                statusDiv.innerText = "❌ Error during startup: " + err.message;
                console.error(err);
            }
        }

        // Action trigger function
        async function executeMessageSend() {
            const text = inputField.value.trim();
            // Block execution if the button is clicked before the model completes loading
            if (!text || !wllama || !isEngineReady) return;

            // Display your user message
            chatDiv.innerHTML += `<div class="msg user-msg"><b>You:</b> ${text}</div>`;
            inputField.value = '';
            chatDiv.scrollTop = chatDiv.scrollHeight;

            // Add thinking placeholder
            chatDiv.innerHTML += `<div id="loading-reply" class="msg ai-msg"><b>AI:</b> Thinking...</div>`;
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            try {
                // Proper completion text schema formatting targeting the backend
                const rawPrompt = `<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
                const output = await wllama.createCompletion(rawPrompt, {
                    n_predict: 150
                });

                const placeholder = document.getElementById('loading-reply');
                if (placeholder) placeholder.remove();
                
                const resultText = (typeof output === 'string') ? output : (output.text || "");
                chatDiv.innerHTML += `<div class="msg ai-msg"><b>AI:</b> ${resultText}</div>`;
            } catch (err) {
                const placeholder = document.getElementById('loading-reply');
                if (placeholder) placeholder.innerText = "AI Error: " + err.message;
            }
            
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // Direct event listener attachments
        sendBtn.addEventListener('click', executeMessageSend);

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeMessageSend();
        });

        initAI();
    </script>
</body>
</html>
