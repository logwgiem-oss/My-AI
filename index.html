<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom GGUF Web AI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: auto; }
        #chat { height: 350px; border: 1px solid #333; padding: 15px; overflow-y: auto; background: #1a1a1a; margin-bottom: 10px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
        #status { color: #aaa; font-style: italic; margin-bottom: 15px; font-size: 13px; text-align: center; background: #222; padding: 8px; border-radius: 5px; }
        .input-container { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; font-size: 14px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
        .msg { margin-bottom: 10px; }
        .user-msg { color: #64b5f6; }
        .ai-msg { color: #a5d6a7; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-bottom: 5px;">Custom Qwen 2.5 Coder</h2>
    <div id="status">Loading Custom AI Engine...</div>
    <div id="chat"></div>
    
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Type a message...">
        <button id="sendBtn" disabled>Send</button>
    </div>

    <script type="module">
        // Loads the browser engine directly from your own repository file
        import { BrowserAI } from "./ai-engine.js";

        // YOUR EXACT CUSTOM HUGGING FACE GGUF FILE LINK
        const MY_GGUF_URL = "https://huggingface.co/LowgieM/Ai/resolve/main/qwen2.5-coder-1.5b-instruct-q2_k.gguf";

        let engineInstance;
        const statusDiv = document.getElementById('status');
        const chatDiv = document.getElementById('chat');
        const sendBtn = document.getElementById('sendBtn');
        const inputField = document.getElementById('userInput');

        async function initAI() {
            try {
                statusDiv.innerText = "Connecting to your Hugging Face GGUF link...";
                
                // Initialize the engine using your specific model URL
                engineInstance = await BrowserAI.init(MY_GGUF_URL, (progressText) => {
                    statusDiv.innerText = progressText;
                });

                statusDiv.innerText = "✨ AI Ready! Running your custom GGUF completely in this browser tab.";
                sendBtn.disabled = false;
            } catch (err) {
                statusDiv.innerText = "❌ Error: " + err.message;
                console.error(err);
            }
        }

        async function executeMessageSend() {
            const text = inputField.value.trim();
            if (!text || !engineInstance) return;

            chatDiv.innerHTML += `<div class="msg user-msg"><b>You:</b> ${text}</div>`;
            inputField.value = '';
            chatDiv.scrollTop = chatDiv.scrollHeight;

            chatDiv.innerHTML += `<div id="loading-reply" class="msg ai-msg"><b>AI:</b> Thinking...</div>`;
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            try {
                const messages = [{ role: "user", content: text }];
                
                // Run text generation directly through your custom cached model file
                const reply = await engineInstance.chat.completions.create({ messages });
                const output = reply.choices[0].message.content;

                const placeholder = document.getElementById('loading-reply');
                if (placeholder) placeholder.remove();
                
                chatDiv.innerHTML += `<div class="msg ai-msg"><b>AI:</b> ${output}</div>`;
            } catch (err) {
                const placeholder = document.getElementById('loading-reply');
                if(placeholder) placeholder.innerText = "AI Error: " + err.message;
            }
            
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        sendBtn.addEventListener('click', executeMessageSend);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeMessageSend();
        });

        initAI();
    </script>
</body>
</html>
