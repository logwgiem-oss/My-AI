<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Uncapped GGUF Loader</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #000; color: #fff; }
        .box { border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #111; }
        button, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; }
        button { background: #007aff; font-weight: bold; cursor: pointer; border: none; }
        button:disabled { background: #444; cursor: not-allowed; }
        #chat { height: 320px; overflow-y: auto; border: 1px solid #333; padding: 10px; background: #050505; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>iPhone Hardware GGUF Pipeline</h2>
    
    <div class="box">
        <label><strong>Target Model Layer:</strong></label>
        <p style="color:#aaa; font-size: 13px; margin: 5px 0;">LowgieM/Ai -> qwen2.5-coder-1.5b-instruct-q2_k.gguf</p>
        <p id="status" style="color: #ff9500; font-weight: bold;">Status: Waiting for model deployment initialization...</p>
    </div>

    <div class="box">
        <label><strong>2. Direct Chat:</strong></label>
        <div id="chat"></div>
        <textarea id="promptInput" placeholder="Type prompt to send straight to chip memory..." rows="3"></textarea>
        <button id="sendBtn" disabled>Execute Inference</button>
    </div>

    <script type="module">
        import { Wllama } from './engine/wllama.js';

        let wllamaInstance = null;

        async function runAutoInitialization() {
            const status = document.getElementById('status');
            status.innerText = "Spawning local WebAssembly hardware layer...";
            
            try {
                wllamaInstance = new Wllama({
                    "default": "./engine/wllama.wasm"
                });

                status.innerText = "Connecting to your Hugging Face LFS Storage... (Do not close Safari)";
                
                // FIXED: Direct lookup using native HF parameters to bypass proxy blocks
                await wllamaInstance.loadModelFromHF({
                    repo: "LowgieM/Ai",
                    file: "qwen2.5-coder-1.5b-instruct-q2_k.gguf"
                }, {
                    n_ctx: 512,        // Prevents Apple WebKit buffer crashes
                    embeddings: false
                });
                
                status.innerText = "SUCCESS: Qwen Coder model loaded onto A19 hardware!";
                status.style.color = "#34c759";
                document.getElementById('sendBtn').disabled = false;
            } catch (err) {
                // FALLBACK: If standard API path triggers a CORS drop, we fall back to a direct stream
                try {
                    status.innerText = "API blocked. Attempting direct file stream path...";
                    const directLink = "https://huggingface.co/LowgieM/Ai/resolve/main/qwen2.5-coder-1.5b-instruct-q2_k.gguf";
                    
                    await wllamaInstance.loadModelFromUrl(directLink, {
                        n_ctx: 512,
                        embeddings: false
                    });
                    
                    status.innerText = "SUCCESS: Qwen Coder model loaded via streaming link!";
                    status.style.color = "#34c759";
                    document.getElementById('sendBtn').disabled = false;
                } catch (fallbackErr) {
                    status.innerText = "Allocation Failed: " + fallbackErr.message;
                    status.style.color = "#ff3b30";
                }
            }
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const promptInput = document.getElementById('promptInput');
            const chat = document.getElementById('chat');
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            chat.innerHTML += `<div><b>You:</b> ${prompt}</div>`;
            promptInput.value = '';
            const responseDiv = document.createElement('div');
            responseDiv.innerHTML = `<b>AI:</b> `;
            chat.appendChild(responseDiv);

            try {
                await wllamaInstance.createCompletion(prompt, (token) => {
                    responseDiv.innerHTML += token.text;
                    chat.scrollTop = chat.scrollHeight;
                });
            } catch (err) {
                responseDiv.innerHTML += ` [Error: ${err.message}]`;
            }
        });

        // Trigger pipeline boot automatically on page load
        window.addEventListener('DOMContentLoaded', runAutoInitialization);
    </script>
</body>
</html>
